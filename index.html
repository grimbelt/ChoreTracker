<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chore Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --success-hover: #059669;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.5;
        }

        h1, h2 { color: var(--text-main); }
        
        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], select {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            color: white;
        }

        .btn-add { background-color: var(--primary); }
        .btn-add:hover { background-color: var(--primary-hover); }
        
        .btn-complete { background-color: var(--success); padding: 6px 12px; font-size: 14px;}
        .btn-complete:hover { background-color: var(--success-hover); }

        .btn-edit { background-color: var(--warning); padding: 6px 12px; font-size: 14px;}
        .btn-edit:hover { background-color: var(--warning-hover); }

        ul { list-style: none; padding: 0; margin: 0; }
        
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e5e7eb;
        }
        
        li:last-child { border-bottom: none; }

        .chore-actions { display: flex; gap: 8px; }

        .history-item {
            flex-direction: column;
            align-items: flex-start;
        }

        .history-meta {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Modal Styles */
        #completionModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 300px;
        }
        .modal-content h3 { margin-top: 0; }
    </style>
</head>
<body>

    <h1>Home Operations</h1>

    <div class="card">
        <h2>Add a Chore</h2>
        <div class="input-group">
            <input type="text" id="newChoreInput" placeholder="What needs to be done?">
            <button class="btn-add" onclick="addChore()">Add</button>
        </div>
    </div>

    <div class="card">
        <h2>Active Backlog</h2>
        <ul id="activeChoresList"></ul>
    </div>

    <div class="card">
        <h2>Completed Log</h2>
        <ul id="completedChoresList"></ul>
    </div>

    <div id="completionModal">
        <div class="modal-content">
            <h3>Who did this?</h3>
            <select id="personSelect" style="width: 100%; margin-bottom: 15px;">
                <option value="Mathieu">Mathieu</option>
                <option value="Lucie">Lucie</option>
            </select>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button style="background: var(--text-muted);" onclick="closeModal()">Cancel</button>
                <button class="btn-complete" onclick="confirmCompletion()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // Initial setup with some tailored starter tasks if storage is empty
        const defaultChores = [
            { id: 1, text: "Clean the litter boxes" },
            { id: 2, text: "Sterilize baby bottles" },
            { id: 3, text: "Take out the recycling" }
        ];

        let chores = JSON.parse(localStorage.getItem('activeChores')) || defaultChores;
        let history = JSON.parse(localStorage.getItem('choreHistory')) || [];
        let pendingCompletionId = null;

        function saveState() {
            localStorage.setItem('activeChores', JSON.stringify(chores));
            localStorage.setItem('choreHistory', JSON.stringify(history));
            render();
        }

        function render() {
            const activeList = document.getElementById('activeChoresList');
            const historyList = document.getElementById('completedChoresList');

            // Render Active
            activeList.innerHTML = chores.length === 0 ? '<li style="color: var(--text-muted)">All caught up!</li>' : '';
            chores.forEach(chore => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${chore.text}</span>
                    <div class="chore-actions">
                        <button class="btn-edit" onclick="editChore(${chore.id})">Edit</button>
                        <button class="btn-complete" onclick="openCompleteModal(${chore.id})">Done</button>
                    </div>
                `;
                activeList.appendChild(li);
            });

            // Render History (most recent first)
            historyList.innerHTML = history.length === 0 ? '<li style="color: var(--text-muted)">No completed chores yet.</li>' : '';
            [...history].reverse().forEach(log => {
                const li = document.createElement('li');
                li.className = 'history-item';
                li.innerHTML = `
                    <strong>${log.text}</strong>
                    <div class="history-meta">Completed by <b>${log.person}</b> on ${log.date}</div>
                `;
                historyList.appendChild(li);
            });
        }

        function addChore() {
            const input = document.getElementById('newChoreInput');
            const text = input.value.trim();
            if (text) {
                chores.push({ id: Date.now(), text: text });
                input.value = '';
                saveState();
            }
        }

        function editChore(id) {
            const chore = chores.find(c => c.id === id);
            const newText = prompt("Edit chore:", chore.text);
            if (newText !== null && newText.trim() !== "") {
                chore.text = newText.trim();
                saveState();
            }
        }

        function openCompleteModal(id) {
            pendingCompletionId = id;
            document.getElementById('completionModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('completionModal').style.display = 'none';
            pendingCompletionId = null;
        }

        function confirmCompletion() {
            const person = document.getElementById('personSelect').value;
            const choreIndex = chores.findIndex(c => c.id === pendingCompletionId);
            
            if (choreIndex > -1) {
                const completedChore = chores.splice(choreIndex, 1)[0];
                
                // Format the date nicely
                const now = new Date();
                const dateString = now.toLocaleDateString() + ' at ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                history.push({
                    id: completedChore.id,
                    text: completedChore.text,
                    person: person,
                    date: dateString
                });

                // Keep history trim (optional: limit to last 50 items)
                if(history.length > 50) history.shift();

                saveState();
                closeModal();
            }
        }

        // Allow pressing Enter to add a chore
        document.getElementById('newChoreInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') addChore();
        });

        // Initial render
        render();
    </script>
</body>
</html>
